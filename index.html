<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGGS</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #222222;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top bar */

        .topbar {
            height: 60px;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            font-weight: bold;
            font-size: 18px;
        }

        .menu-button {
            position: absolute;
            left: 18px;
            border: none;
            background: none;
            font-size: 24px;
            cursor: pointer;
        }

        /* Chat area */

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px 120px;
        }

        .message {
            max-width: 750px;
            margin: 0 auto 28px;
            display: flex;
        }

        .message.ggs {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            padding: 13px 17px;
            border-radius: 18px;
            max-width: 70%;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .ggs .bubble {
            background: #f4f4f4;
        }

        .user .bubble {
            background: #e8f0fe;
        }

        /* Bottom input */

        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 18px;
            background: white;
            border-top: 1px solid #eeeeee;
        }

        .input-box {
            max-width: 750px;
            margin: auto;
            display: flex;
            border: 1px solid #cccccc;
            border-radius: 25px;
            padding: 5px;
            background: white;
        }

        input {
            flex: 1;
            border: none;
            outline: none;
            padding: 12px 15px;
            font-size: 15px;
        }

        input:disabled {
            background: #f5f5f5;
            cursor: not-allowed;
        }

        .send {
            border: none;
            background: #222222;
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }

        .send:hover {
            background: #444444;
        }

        .send:disabled {
            background: #aaaaaa;
            cursor: not-allowed;
        }

        /* Status */

        .status {
            text-align: center;
            font-size: 13px;
            color: #777777;
            margin-top: -15px;
            margin-bottom: 25px;
        }

        .status.offline {
            color: #dc2626;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- Top bar -->

    <div class="topbar">
        <button class="menu-button">☰</button>
        ChatGGS
    </div>


    <!-- Chat -->

    <div class="chat" id="chat">

        <div
            class="status"
            id="status"
        >
            Checking ChatGGS availability...
        </div>

        <div class="message ggs">
            <div class="bubble">
                Hello! I am ChatGGS — Gabriel Genuine Stupidity.
            </div>
        </div>

        <div class="message user">
            <div class="bubble">
                Hello ChatGGS!
            </div>
        </div>

        <div class="message ggs">
            <div class="bubble">
                Hello. What do you want?
            </div>
        </div>

    </div>


    <!-- Input -->

    <div class="input-area">

        <div class="input-box">

            <input
                type="text"
                id="messageInput"
                placeholder="Message ChatGGS..."
            >

            <button
                class="send"
                id="sendButton"
                onclick="sendMessage()"
            >
                ➤
            </button>

        </div>

    </div>


    <script>

        /* ---------------------------------
           SUPABASE
        --------------------------------- */

        const SUPABASE_URL =
            "https://yzzejlfrlecakqrjtimg.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_G7HpAAnLsn2Dal63ginOIw_dcw6eowo";

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        /* ---------------------------------
           CHATGGS STATUS
        --------------------------------- */

        let chatGGSOnline = true;


        async function loadStatus() {

            const status =
                document.getElementById("status");

            const input =
                document.getElementById("messageInput");

            const sendButton =
                document.getElementById("sendButton");


            const result =
                await supabaseClient
                    .from("settings")
                    .select("online")
                    .eq("id", 1)
                    .single();


            if (result.error) {

                console.error(result.error);

                status.textContent =
                    "⚠️ Could not load ChatGGS status.";

                return;
            }


            chatGGSOnline =
                result.data.online;


            if (chatGGSOnline) {

                status.textContent =
                    "🟢 ChatGGS is available";

                status.classList.remove("offline");

                input.disabled = false;
                sendButton.disabled = false;

                input.placeholder =
                    "Message ChatGGS...";

            } else {

                status.textContent =
                    "🔴 ChatGGS is unavailable";

                status.classList.add("offline");

                input.disabled = true;
                sendButton.disabled = true;

                input.placeholder =
                    "ChatGGS is unavailable";

            }
        }


        /* ---------------------------------
           SEND MESSAGE
        --------------------------------- */

        function sendMessage() {

            if (!chatGGSOnline) {
                return;
            }


            const input =
                document.getElementById("messageInput");

            const chat =
                document.getElementById("chat");


            const text =
                input.value.trim();


            if (text === "") {
                return;
            }


            const message =
                document.createElement("div");

            message.className =
                "message user";


            const bubble =
                document.createElement("div");

            bubble.className =
                "bubble";


            // Display user input as text, not HTML.
            bubble.textContent =
                text;


            message.appendChild(bubble);
            chat.appendChild(message);


            input.value = "";

            chat.scrollTop =
                chat.scrollHeight;
        }


        /* ---------------------------------
           ENTER KEY
        --------------------------------- */

        document
            .getElementById("messageInput")
            .addEventListener(
                "keydown",
                function(event) {

                    if (event.key === "Enter") {
                        sendMessage();
                    }

                }
            );


        /* ---------------------------------
           INITIAL STATUS CHECK
        --------------------------------- */

        loadStatus();


        /* ---------------------------------
           CHECK EVERY 5 SECONDS
        --------------------------------- */

        setInterval(
            loadStatus,
            5000
        );

    </script>

</body>
</html>
